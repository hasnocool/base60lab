[package]
name = "base60lab-wasm"
version = "0.1.0"
edition = "2021"
description = "Base-60 exact rational arithmetic for WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.5"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "SvgElement", "SvgsvgElement", "SvgRectElement", "SvgTextElement", "SvgCircleElement", "SvgPathElement", "SvgPolygonElement", "SvgLineElement", "SvggElement"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"